<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>focus-trap demo</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        padding: 2rem;
        max-width: 40rem;
      }
      button,
      input {
        font: inherit;
        padding: 0.4rem 0.7rem;
      }
      .stack > * + * {
        margin-top: 0.75rem;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgb(0 0 0 / 0.4);
      }
      .backdrop[data-open] {
        display: grid;
      }
      .modal {
        background: white;
        padding: 1.5rem;
        border-radius: 0.5rem;
        min-width: 20rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h1>focus-trap demo</h1>
    <p>
      Tab around the page, then open the modal. Focus should stay inside it.
      Use the buttons below to exercise dynamic content and the options.
    </p>

    <div class="stack">
      <button id="open">Open modal</button>
      <a href="https://example.com">A link outside the trap</a>
    </div>

    <div class="backdrop" id="backdrop">
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Demo dialog">
        <div class="stack">
          <h2>Trapped dialog</h2>
          <input id="name" type="text" placeholder="Your name" />
          <div class="row" id="dynamic-host">
            <button id="add">Add a field</button>
            <button id="remove-self">Remove me</button>
          </div>
          <div class="row">
            <button id="close">Close</button>
            <button id="confirm">Confirm</button>
          </div>
          <p><small>Esc closes. Click the backdrop to close (clickOutsideDeactivates).</small></p>
        </div>
      </div>
    </div>

    <script type="module">
      import { createFocusTrap } from './src/index.ts';

      const backdrop = document.getElementById('backdrop');
      const modal = document.getElementById('modal');
      const trap = createFocusTrap(modal, { clickOutsideDeactivates: true });

      function open() {
        backdrop.setAttribute('data-open', '');
        trap.activate();
      }

      function close() {
        trap.deactivate();
        backdrop.removeAttribute('data-open');
      }

      document.getElementById('open').addEventListener('click', open);
      document.getElementById('close').addEventListener('click', close);
      document.getElementById('confirm').addEventListener('click', close);

      // Re-hide the backdrop whenever the trap turns itself off.
      backdrop.addEventListener('focusout', () => {
        if (!trap.active) backdrop.removeAttribute('data-open');
      });

      // Dynamic content: verify the observer keeps focus inside on removal and
      // that new fields join the tab cycle.
      let counter = 0;
      document.getElementById('add').addEventListener('click', () => {
        const field = document.createElement('input');
        field.type = 'text';
        field.placeholder = `Extra field ${++counter}`;
        document.getElementById('dynamic-host').append(field);
        field.focus();
      });
      document.getElementById('remove-self').addEventListener('click', (e) => {
        e.currentTarget.remove();
      });
    </script>
  </body>
</html>
